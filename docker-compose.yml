# ─────────────────────────────────────────────────────────────
# BlueBeakend — self-hosted Firebase alternative
# Docker Compose stack: api · postgres · redis · minio · nginx · realtime
#
# Note: MinIO upstream discontinued public `minio/minio` & `minio/mc`
# Docker Hub images in late 2025. BlueBeakend includes a built-in
# S3-compatible object storage service (`ROLE=minio` on :9000) backed
# by the `miniodata` volume, while remaining 100% compatible with any
# external S3 / Cloudflare R2 / AWS S3 endpoint via S3_ENDPOINT.
# ─────────────────────────────────────────────────────────────

name: bluebeakend

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bluebeakend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bluebeakend}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bluebeakend} -d ${POSTGRES_DB:-bluebeakend}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [bbnet]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [bbnet]

  minio:
    image: bluebeakend-core:1.0.0
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      ROLE: minio
      PORT: "9000"
      HOST: "0.0.0.0"
      S3_DATA_DIR: /data
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bluebeakend}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-bluebeakend}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [bbnet]

  api:
    image: bluebeakend-core:1.0.0
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bluebeakend}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bluebeakend}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-bluebeakend}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET:-bluebeakend}
      PORT: "8080"
      HOST: "0.0.0.0"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - apistorage:/app/storage-data
      - backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [bbnet]

  realtime:
    image: bluebeakend-core:1.0.0
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bluebeakend}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bluebeakend}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-bluebeakend}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET:-bluebeakend}
      PORT: "8081"
      HOST: "0.0.0.0"
      ROLE: realtime
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [bbnet]

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
    ports:
      - "${BB_HTTP_PORT:-80}:80"
      - "${BB_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/bluebeakend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [bbnet]

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - ./nginx/ssl:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"
    restart: unless-stopped
    networks: [bbnet]

volumes:
  pgdata:
  redisdata:
  miniodata:
  apistorage:
  backups:
  certbot-www:

networks:
  bbnet:
    driver: bridge
