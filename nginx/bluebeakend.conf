# ─────────────────────────────────────────────────────────────
# BlueBeakend — Nginx reverse proxy
#   /            → API + Admin UI (Fastify) :8080
#   /realtime    → WebSocket (realtime)     :8081
#   /admin       → Next.js 14 Dashboard     :8080
#   /docs        → Swagger UI               :8080
#
# By default, HTTP (:80) serves traffic directly so fresh IP-only
# VPS installs work immediately. When `bb` [9] Domain & SSL is
# configured, Let's Encrypt certs are provisioned and HTTPS redirect
# is enabled automatically.
# ─────────────────────────────────────────────────────────────

upstream bb_api       { server api:8080;      keepalive 32; }
upstream bb_realtime  { server realtime:8081; keepalive 32; }

limit_req_zone $binary_remote_addr zone=bb_rl:10m rate=20r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # __HTTPS_REDIRECT_MARKER__ (toggled by `bb` option [9] Domain & SSL)

    location /realtime {
        proxy_pass http://bb_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_req zone=bb_rl burst=40 nodelay;
        proxy_pass http://bb_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/live/bluebeakend/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/bluebeakend/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 100m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /realtime {
        proxy_pass http://bb_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_req zone=bb_rl burst=40 nodelay;
        proxy_pass http://bb_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
